<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Inside Rumy: smart chore planner, shared expenses, conflict prevention, roommate profiles">
  <style>
    {{FONT}}
    text { font-family: 'Nunito', sans-serif; fill: #1a1a1a; }
    .h2 { font-size: 40px; font-weight: 900; letter-spacing: -1px; }
    .kick { font-size: 16px; font-weight: 800; letter-spacing: 2.5px; fill: #a8891a; }
    .t { font-size: 21px; font-weight: 900; }
    .s { font-size: 15px; font-weight: 700; fill: #6b665a; }
    .num { font-size: 14px; font-weight: 900; }

    .fb { transform-box: fill-box; }
    .tile { opacity: 0; animation: up .8s cubic-bezier(.2,.9,.25,1.15) both; }
    .d1 { animation-delay: .25s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .65s; } .d4 { animation-delay: .85s; }
    @keyframes up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    .head { animation: up .7s ease-out both; }

    .icon { animation: bob 3.2s ease-in-out infinite; }
    .i2 { animation-delay: -.8s; } .i3 { animation-delay: -1.6s; } .i4 { animation-delay: -2.4s; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(2deg); } }

    .line { stroke-dasharray: 8 10; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -18; } }
  </style>
  <defs>
    <path id="star" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14Z"/>
  </defs>

  <rect x="11" y="13" width="1184" height="420" rx="34" fill="#1a1a1a"/>
  <rect x="3" y="3" width="1184" height="420" rx="34" fill="#fffdf4" stroke="#1a1a1a" stroke-width="3"/>

  <g class="head fb">
    <text x="60" y="62" class="kick">WHAT I'M BUILDING</text>
    <text x="58" y="108" class="h2">Inside Rumy</text>
    <text x="300" y="106" class="s" style="font-size:18px">the invisible roommate that keeps a shared home running.</text>
  </g>

  <!-- connector -->
  <path class="line" d="M190,250 H1000" fill="none" stroke="#e8c840" stroke-width="4" stroke-linecap="round"/>

  <!-- tile 1 -->
  <g class="tile d1 fb">
    <rect x="62" y="146" width="250" height="248" rx="24" fill="#e8c840"/>
    <rect x="56" y="140" width="250" height="248" rx="24" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
    <circle cx="272" cy="172" r="16" fill="#fcefb4" stroke="#1a1a1a" stroke-width="2"/><text x="272" y="177" text-anchor="middle" class="num">01</text>
    <g class="icon fb"><image href="{{IMG:SmartChorePlanner.webp}}" x="78" y="156" width="104" height="104"/></g>
    <text x="80" y="300" class="t">Smart chore planner</text>
    <text x="80" y="328" class="s">Fair, rotating tasks that</text>
    <text x="80" y="349" class="s">fit everyone's actual week.</text>
  </g>

  <!-- tile 2 -->
  <g class="tile d2 fb">
    <rect x="344" y="146" width="250" height="248" rx="24" fill="#e8c840"/>
    <rect x="338" y="140" width="250" height="248" rx="24" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
    <circle cx="554" cy="172" r="16" fill="#fcefb4" stroke="#1a1a1a" stroke-width="2"/><text x="554" y="177" text-anchor="middle" class="num">02</text>
    <g class="icon i2 fb"><image href="{{IMG:SharedExpenseTracker.webp}}" x="360" y="156" width="104" height="104"/></g>
    <text x="362" y="300" class="t">Shared expenses</text>
    <text x="362" y="328" class="s">Split bills, track who paid,</text>
    <text x="362" y="349" class="s">settle up. No awkward asks.</text>
  </g>

  <!-- tile 3 -->
  <g class="tile d3 fb">
    <rect x="626" y="146" width="250" height="248" rx="24" fill="#e8c840"/>
    <rect x="620" y="140" width="250" height="248" rx="24" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
    <circle cx="836" cy="172" r="16" fill="#fcefb4" stroke="#1a1a1a" stroke-width="2"/><text x="836" y="177" text-anchor="middle" class="num">03</text>
    <g class="icon i3 fb"><image href="{{IMG:ConflictPrevention.webp}}" x="642" y="156" width="120" height="104"/></g>
    <text x="644" y="300" class="t">Conflict prevention</text>
    <text x="644" y="328" class="s">Spots friction early, before</text>
    <text x="644" y="349" class="s">it turns into a group-chat war.</text>
  </g>

  <!-- tile 4 -->
  <g class="tile d4 fb">
    <rect x="908" y="146" width="250" height="248" rx="24" fill="#e8c840"/>
    <rect x="902" y="140" width="250" height="248" rx="24" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
    <circle cx="1118" cy="172" r="16" fill="#fcefb4" stroke="#1a1a1a" stroke-width="2"/><text x="1118" y="177" text-anchor="middle" class="num">04</text>
    <g class="icon i4 fb"><image href="{{IMG:RoommatesProfile.webp}}" x="924" y="156" width="112" height="104"/></g>
    <text x="926" y="300" class="t">Roommate profiles</text>
    <text x="926" y="328" class="s">Learns how each person</text>
    <text x="926" y="349" class="s">actually lives in the home.</text>
  </g>

  <g transform="translate(1140 70) scale(.9)"><use href="#star" xlink:href="#star" fill="#e8c840"/></g>
  <g transform="translate(1108 100) scale(.5)"><use href="#star" xlink:href="#star" fill="#1a1a1a"/></g>
</svg>
