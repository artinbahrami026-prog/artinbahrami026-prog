<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Shared living, minus the drama. Join the Rumy waitlist at rumyapp.com">
  <style>
    {{FONT}}
    text { font-family: 'Nunito', sans-serif; fill: #1a1a1a; }
    .h { font-size: 48px; font-weight: 900; letter-spacing: -1.2px; }
    .s { font-size: 20px; font-weight: 700; fill: #4d4320; }
    .btn-t { font-size: 19px; font-weight: 800; fill: #fff; }
    .btn-u { font-size: 19px; font-weight: 800; fill: #f5e070; }
    .fb { transform-box: fill-box; }

    .bob { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(1.5deg); } }

    .heart { opacity: 0; animation: rise 4s ease-out infinite; }
    .h2 { animation-delay: 1.3s; } .h3 { animation-delay: 2.6s; }
    @keyframes rise {
      0% { opacity: 0; transform: translate(0,0) scale(.4); }
      15% { opacity: 1; transform: translate(4px,-14px) scale(1); }
      100% { opacity: 0; transform: translate(-10px,-110px) scale(.8); }
    }
    .shine { animation: shine 3.6s ease-in-out 1s infinite; }
    @keyframes shine { 0% { transform: translateX(-120px) skewX(-20deg); } 45%,100% { transform: translateX(500px) skewX(-20deg); } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .ring { transform-origin: 0 0; transform-box: view-box; animation: ring 2.4s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  </style>
  <defs>
    <clipPath id="card"><rect x="3" y="3" width="1184" height="280" rx="34"/></clipPath>
    <clipPath id="btn"><rect x="60" y="190" width="390" height="56" rx="28"/></clipPath>
    <path id="heart" d="M0,6 C-10,-2 -14,-8 -10,-13 C-7,-17 -2,-16 0,-12 C2,-16 7,-17 10,-13 C14,-8 10,-2 0,6Z"/>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1a1a1a" opacity=".12"/>
    </pattern>
  </defs>

  <rect x="11" y="13" width="1184" height="280" rx="34" fill="#1a1a1a"/>
  <rect x="3" y="3" width="1184" height="280" rx="34" fill="#f5e070"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="1010" cy="160" r="170" fill="#fcefb4">
      <animate attributeName="r" values="170;186;170" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="3" y="3" width="1184" height="280" rx="34" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <text x="58" y="96" class="h">Shared living,</text>
  <text x="58" y="150" class="h">minus the drama.</text>

  <!-- live dot -->
  <g transform="translate(492 218)">
    <circle class="ring" r="9" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <circle r="6" fill="#1a1a1a"/>
  </g>
  <text x="510" y="225" class="s">Early access is open</text>

  <g>
    <rect x="64" y="195" width="390" height="56" rx="28" fill="#fff"/>
    <rect x="60" y="190" width="390" height="56" rx="28" fill="#1a1a1a"/>
    <g clip-path="url(#btn)"><rect class="shine" x="60" y="180" width="46" height="80" fill="#fff" opacity=".18"/></g>
    <text x="92" y="225" class="btn-t">Join the waitlist</text>
    <g class="arrow"><path d="M256,218 h20 m-7,-7 l7,7 l-7,7" fill="none" stroke="#f5e070" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="290" y="225" class="btn-u">rumyapp.com</text>
  </g>

  <!-- mascot -->
  <g class="bob fb">
    <image href="{{IMG:Rumy_Watering.webp}}" x="870" y="22" width="243" height="260"/>
  </g>
  <g transform="translate(1100 70)"><use href="#heart" xlink:href="#heart" class="heart" fill="#f06b6b" stroke="#1a1a1a" stroke-width="1.5"/></g>
  <g transform="translate(1128 92) scale(.8)"><use href="#heart" xlink:href="#heart" class="heart h2" fill="#f06b6b" stroke="#1a1a1a" stroke-width="1.5"/></g>
  <g transform="translate(1080 88) scale(.65)"><use href="#heart" xlink:href="#heart" class="heart h3" fill="#f06b6b" stroke="#1a1a1a" stroke-width="1.5"/></g>
</svg>
