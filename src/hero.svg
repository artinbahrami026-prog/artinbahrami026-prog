<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Artin Bahrami. Based in Toronto, headed to San Francisco. Founder, product designer, self-taught engineer.">
  <style>
    {{FONT:serif,serif-italic,mono,grotesk}}
    .serif { font-family: 'Instrument Serif', serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .grot { font-family: 'Space Grotesk', sans-serif; }
    .name { font-size: 158px; fill: #f3efe6; letter-spacing: -3px; }
    .label { font-size: 15px; font-weight: 500; letter-spacing: 3.5px; fill: #8c8b96; }
    .lead { font-size: 27px; font-weight: 400; fill: #c9c6bd; }
    .word { font-size: 40px; font-style: italic; fill: #f3efe6; }
    .city { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; fill: #f3efe6; }
    .coord { font-size: 13px; fill: #8c8b96; }

    .fb { transform-box: fill-box; }
    .in { opacity: 0; animation: up 1s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .75s; } .d5 { animation-delay: 1s; }
    @keyframes up { from { opacity: 0; transform: translateY(30px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }

    .w { opacity: 0; animation: rot 12s cubic-bezier(.6,0,.2,1) 1.2s infinite both; }
    .w2 { animation-delay: 4.2s; } .w3 { animation-delay: 7.2s; } .w4 { animation-delay: 10.2s; }
    @keyframes rot {
      0% { opacity: 0; transform: translateY(26px); filter: blur(6px); }
      5% { opacity: 1; transform: none; filter: blur(0); }
      21% { opacity: 1; transform: none; filter: blur(0); }
      25%, 100% { opacity: 0; transform: translateY(-26px); filter: blur(6px); }
    }

    .arc { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 7s ease-in-out 1.4s infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }

    .live { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .tw { animation: tw 3s ease-in-out infinite; }
    .t2 { animation-delay: .8s; } .t3 { animation-delay: 1.6s; } .t4 { animation-delay: 2.3s; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="480" rx="28"/></clipPath>
    <clipPath id="globe"><circle cx="935" cy="250" r="178"/></clipPath>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a338"/><stop offset=".55" stop-color="#f07a5a"/><stop offset="1" stop-color="#7cc8ff"/>
    </linearGradient>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="1040" y1="0" x2="830" y2="0">
      <stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#f4a338"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#f4a338" stop-opacity=".22"/><stop offset="1" stop-color="#f4a338" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#7cc8ff" stop-opacity=".2"/><stop offset="1" stop-color="#7cc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sphere" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#1b1d28"/><stop offset="1" stop-color="#0b0c11"/>
    </radialGradient>
    <path id="route-path" d="M1040,232 Q945,70 832,200"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="#0b0c11"/>
    <circle cx="120" cy="470" r="380" fill="url(#glowA)"/>
    <circle cx="960" cy="220" r="330" fill="url(#glowB)">
      <animate attributeName="r" values="330;360;330" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- stars -->
    <g fill="#f3efe6">
      <circle class="tw" cx="640" cy="60" r="1.6"/><circle class="tw t2" cx="700" cy="420" r="1.3"/>
      <circle class="tw t3" cx="1150" cy="80" r="1.8"/><circle class="tw t4" cx="1160" cy="430" r="1.4"/>
      <circle class="tw t2" cx="560" cy="140" r="1.2"/><circle class="tw" cx="760" cy="40" r="1.2"/>
      <circle class="tw t3" cx="1110" cy="300" r="1.1"/><circle class="tw t4" cx="610" cy="300" r="1.3"/>
    </g>

    <!-- globe -->
    <circle cx="935" cy="250" r="178" fill="url(#sphere)"/>
    <g clip-path="url(#globe)" fill="none" stroke="#7cc8ff" stroke-opacity=".16" stroke-width="1.2">
      <ellipse cx="935" cy="250" rx="178" ry="30"/>
      <ellipse cx="935" cy="190" rx="168" ry="27"/><ellipse cx="935" cy="310" rx="168" ry="27"/>
      <ellipse cx="935" cy="130" rx="133" ry="22"/><ellipse cx="935" cy="370" rx="133" ry="22"/>
      <ellipse cx="935" cy="85" rx="80" ry="13"/><ellipse cx="935" cy="415" rx="80" ry="13"/>
      <!-- spinning meridians -->
      <ellipse cx="935" cy="250" ry="178"><animate attributeName="rx" values="0;178;0" dur="12s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 .58 1;.42 0 1 1"/></ellipse>
      <ellipse cx="935" cy="250" ry="178"><animate attributeName="rx" values="0;178;0" dur="12s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 .58 1;.42 0 1 1"/></ellipse>
      <ellipse cx="935" cy="250" ry="178"><animate attributeName="rx" values="0;178;0" dur="12s" begin="-4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 .58 1;.42 0 1 1"/></ellipse>
      <ellipse cx="935" cy="250" ry="178"><animate attributeName="rx" values="0;178;0" dur="12s" begin="-6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 .58 1;.42 0 1 1"/></ellipse>
      <ellipse cx="935" cy="250" ry="178"><animate attributeName="rx" values="0;178;0" dur="12s" begin="-8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 .58 1;.42 0 1 1"/></ellipse>
      <ellipse cx="935" cy="250" ry="178"><animate attributeName="rx" values="0;178;0" dur="12s" begin="-10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 .58 1;.42 0 1 1"/></ellipse>
    </g>
    <circle cx="935" cy="250" r="178" fill="none" stroke="#7cc8ff" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="935" cy="250" r="198" fill="none" stroke="#f3efe6" stroke-opacity=".08" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0 935 250" to="360 935 250" dur="60s" repeatCount="indefinite"/>
    </circle>

    <!-- route: Toronto to San Francisco -->
    <use href="#route-path" fill="none" stroke="#f3efe6" stroke-opacity=".12" stroke-width="2" stroke-dasharray="3 7"/>
    <path class="arc" d="M1040,232 Q945,70 832,200" pathLength="1" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round"/>
    <g>
      <path d="M8,0 L-7,-6 L-4,0 L-7,6 Z" fill="#f3efe6"/>
      <animateMotion dur="7s" begin="1.4s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1">
        <mpath href="#route-path"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.53;.58;1" dur="7s" begin="1.4s" repeatCount="indefinite"/>
    </g>

    <!-- cities -->
    <g>
      <circle cx="1040" cy="232" r="5" fill="#7cc8ff"/>
      <circle cx="1040" cy="232" r="5" fill="none" stroke="#7cc8ff" stroke-width="2">
        <animate attributeName="r" values="5;22" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="1056" y="262" class="mono city">TORONTO</text>
      <text x="1056" y="282" class="mono coord">43.65°N 79.38°W</text>
    </g>
    <g>
      <circle cx="832" cy="200" r="5" fill="#f4a338"/>
      <circle cx="832" cy="200" r="5" fill="none" stroke="#f4a338" stroke-width="2">
        <animate attributeName="r" values="5;22" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="816" y="230" text-anchor="end" class="mono city">SAN FRANCISCO</text>
      <text x="816" y="250" text-anchor="end" class="mono coord">37.77°N 122.42°W</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="478.5" rx="28" fill="none" stroke="#262733" stroke-width="1.5"/>

  <!-- left column -->
  <g class="in d1 fb">
    <circle class="live" cx="68" cy="66" r="5" fill="#5ee38a"/>
    <text x="84" y="71" class="mono label">CURRENTLY BUILDING IN TORONTO</text>
  </g>
  <text x="54" y="208" class="serif name in d2 fb">Artin</text>
  <text x="54" y="330" class="serif name in d3 fb" style="font-style:italic;fill:url(#sun)">Bahrami</text>

  <text x="60" y="404" class="grot lead in d4 fb">I'm a</text>
  <g>
    <text x="{{WX}}" y="406" class="serif word w w1 fb">founder.</text>
    <text x="{{WX}}" y="406" class="serif word w w2 fb">product designer.</text>
    <text x="{{WX}}" y="406" class="serif word w w3 fb">self-taught engineer.</text>
    <text x="{{WX}}" y="406" class="serif word w w4 fb">volleyball libero.</text>
  </g>

  <g class="in d5 fb">
    <text x="60" y="446" class="mono label" style="font-size:13px">TORONTO</text>
    <rect x="{{LX}}" y="440" width="50" height="2" rx="1" fill="url(#sun)"/>
    <text x="{{SX}}" y="446" class="mono label" style="font-size:13px">SAN FRANCISCO NEXT</text>
    <text x="{{BX}}" y="446" class="mono label" style="font-size:13px;fill:#4f4e58">/  BUILDING SINCE 13</text>
  </g>
</svg>
