<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A terminal prints a boarding pass in text characters. Passenger Bahrami, Artin. Toronto (YYZ) to San Francisco (SFO). Flight AB 2008, seat 01A. Boarding soon.">
  <style>
    {{FONT:mono}}
    text { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #c9d1d9; }
    .frame { fill: #484f58; }
    .dim { fill: #7d8590; }
    .val { fill: #e6edf3; font-weight: 700; }
    .head { fill: #e6edf3; font-weight: 800; }
    .from { fill: #79c0ff; font-weight: 700; }
    .to { fill: #f0883e; font-weight: 700; }
    .live { fill: #3fb950; font-weight: 700; }
    .prompt { fill: #3fb950; font-weight: 700; }
    .path { fill: #79c0ff; font-weight: 700; }
    .title { font-size: 13px; fill: #7d8590; }

    /* the command types itself: a cover slides off one character at a time */
    .typing { animation: type 1.3s steps(27) .5s both; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX({{CW}}px); } }
    .row { opacity: 0; animation: on .01s linear both; }
    @keyframes on { to { opacity: 1; } }
    .plane { opacity: 0; animation: on .01s linear {{PLANE_IN}}s both, fly 3.2s ease-in-out {{PLANE_IN}}s infinite; }
    @keyframes fly { 0% { transform: translateX(0); } 50% { transform: translateX(67px); } 100% { transform: translateX(0); } }
    .blink { opacity: 0; animation: on .01s linear {{DONE}}s both, cursor 1s steps(1) {{DONE}}s infinite; }
    @keyframes cursor { 50% { opacity: 0; } }
    .last { opacity: 0; animation: on .01s linear {{DONE}}s both; }
    .first-cursor { animation: hideCursor .01s linear 1.85s both; }
    @keyframes hideCursor { to { opacity: 0; } }
    .blink-early { animation: cursor 1s steps(1) infinite; }
  </style>
  <defs>
    <clipPath id="win"><rect x="20" y="10" width="1160" height="500" rx="14"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="20" y="10" width="1160" height="500" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <g clip-path="url(#win)">
    <rect x="20" y="10" width="1160" height="40" fill="#161b22"/>
    <line x1="20" y1="50" x2="1180" y2="50" stroke="#30363d"/>
  </g>
  <circle cx="46" cy="30" r="6.5" fill="#ff5f57"/><circle cx="68" cy="30" r="6.5" fill="#febc2e"/><circle cx="90" cy="30" r="6.5" fill="#28c840"/>
  <text x="600" y="35" text-anchor="middle" class="title">artin@github: ~/boarding</text>

  <!-- command -->
  <text x="60" y="90" xml:space="preserve"><tspan class="prompt">artin@github</tspan> <tspan class="path">~</tspan> $ ./board --from YYZ --to SFO</text>
  <g class="typing">
    <rect x="{{CX}}" y="72" width="{{CW}}" height="24" fill="#0d1117"/>
    <rect class="first-cursor" x="{{CX}}" y="74" width="10" height="20" fill="#c9d1d9"/>
  </g>

  <!-- ticket, printed row by row -->
  <g>
    {{ASCII}}
  </g>

  <!-- the plane, drawn over the gap between YYZ and SFO -->
  <g class="plane">
    <text x="{{PX}}" y="{{PY1}}" class="val" xml:space="preserve">    __|__</text>
    <text x="{{PX}}" y="{{PY2}}" class="val" xml:space="preserve">--o--(_)--o--</text>
  </g>

  <!-- next prompt -->
  <text x="60" y="490" class="last" xml:space="preserve"><tspan class="prompt">artin@github</tspan> <tspan class="path">~</tspan> $ <tspan class="dim"># see you in SF</tspan></text>
  <rect class="blink" x="{{LX2}}" y="474" width="10" height="20" fill="#c9d1d9"/>
</svg>
